    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            .heading{
                width: 100%;
                height: 40vh;
                display: flex;
                flex-direction: column;
                justify-content: space-around;
                align-items: center;
            }
            .heading h1{
                font-size: 50px;
                font-family:Arial, Helvetica, sans-serif;
            }
            .code-container{
                background-color: antiquewhite;
                margin: auto;
                display: flex;
                gap: 20px;
                height: 100px;
                width: fit-content;
                justify-content: center;
            }
            .code{
                height: 100px;
                width: 100px;
                font-size: 40px;
                text-align: center;
            }
            
        </style>
    </head>
    <body>
        <div class="heading">
            <h1 id="verification_heading">Verify Your Account</h1>
            <h3 id="verification_subtext">Please Enter the six digit code we have sent to shi***@gmail.com</h3>
        </div>
        <div class="code-container">
            <input type="text" maxlength="1" class="code" id="code-1">
            <input type="text" maxlength="1" class="code" id="code-2">
            <input type="text" maxlength="1" class="code" id="code-3">
            <input type="text" maxlength="1" class="code" id="code-4">
            <input type="text" maxlength="1" class="code" id="code-5">
            <input type="text" maxlength="1" class="code" id="code-6">
        </div>
        <script>
            let boxes=document.querySelectorAll(".code");
            boxes.forEach((box,i) => {
                box.addEventListener("input", () => {
					box.value=box.value.replace(/[^0-9]/g,"");
				  if (box.value.length === 1 && i < boxes.length - 1) {
				    boxes[i+1].focus();
				  }
				});
                box.addEventListener("keydown", (e) => {
				  if (e.key === "Backspace") {
				
				    if (box.value !== "") {
				      box.value = "";
				      return;
				    }
				
				    if (i > 0) {
				      boxes[i - 1].focus();
				      boxes[i - 1].value = "";
				    }
				  }
				});
            });
        </script>
    </body>
    </html>
